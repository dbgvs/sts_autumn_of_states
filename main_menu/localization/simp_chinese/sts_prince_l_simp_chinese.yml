l_simp_chinese:
 sts_kfe_chancellery_advance: "梁·霸府秉政"
 sts_kfe_chancellery_advance_desc: "开封中枢、淮军宿将与挟主之嫌。梁以丞相府号令天下，府库与兵甲皆归霸府，然名不正则言不顺。"
 sts_song_court_law: "宋廷政策"
 sts_song_court_law_desc: "梁如何对待手中的宋廷，决定了它在天下人眼中的名分与道路。"
 sts_song_honor_court: "尊王"
 sts_song_honor_court_desc: "奉宋室正朔，以天子之名号令诸侯。正统与外交得利，但丞相府的实权受到约束。"
 sts_song_chancellery_rule: "霸府"
 sts_song_chancellery_rule_desc: "以丞相府直接统治，政令、财赋与人事皆出霸府。行政效率提高，但篡夺之名更盛。"
 sts_song_usurpation: "禅代"
 sts_song_usurpation_desc: "不再遮掩代宋之心，以兵威与天命自任。军事动员与战争承受力增强，天下侧目。"
 sts_xia_qin_armor_advance: "秦·秦甲劲旅"
 sts_xia_qin_armor_advance_desc: "关中四塞，秦甲劲旅。岳氏世镇京兆，扼潼关、镇陇右，为西北长城。"
 sts_qin_law: "秦甲之政"
 sts_qin_law_desc: "秦地以强兵立国，兵制与粮道决定关中能否东出。"
 sts_qin_sharp_armor: "锐士"
 sts_qin_sharp_armor_desc: "厚养秦甲锐士，重步重骑皆选精锐；代价是人力与税赋。"
 sts_qin_militia: "府兵"
 sts_qin_militia_desc: "恢复府兵征召，兵农合一，人力充足但野战能力稍逊。"
 sts_qin_farm_colonies: "屯田"
 sts_qin_farm_colonies_desc: "以军屯养军，粮道稳固、税入增加，但操练与战意下降。"
 sts_qi_maritime_advance: "齐·海岱舟师"
 sts_qi_maritime_advance_desc: "海岱之间，古齐旧疆。齐王兼习舟师，控三齐雄镇，东接莱王，西临大河。"
 sts_qi_law: "齐地军政"
 sts_qi_law_desc: "齐地负海带河，舟师、步骑与盐利三者不可兼得。"
 sts_qi_navy: "舟师"
 sts_qi_navy_desc: "扩建齐地舟师，控扼渤海与黄海，但陆军操练稍弛。"
 sts_qi_infantry: "海岱步骑"
 sts_qi_infantry_desc: "以青齐步骑为骨干，陆战强而海防弱。"
 sts_qi_salt: "盐利"
 sts_qi_salt_desc: "以盐利养军，府库充盈，但兵源与战意受商利侵蚀。"
 sts_lai_sea_trade_advance: "莱·东方海隅"
 sts_lai_sea_trade_advance_desc: "东方海隅，古莱旧壤。赵氏莱王世袭镇登、宁海，扼胶东半岛，坐拥登州巨港。"
 sts_lai_law: "莱地海政"
 sts_lai_law_desc: "莱国孤悬半岛，市舶、海防与封贡决定它的存亡。"
 sts_lai_shipping: "市舶"
 sts_lai_shipping_desc: "开登州港，通辽东、高丽，商税与海运大兴，陆军人力受限。"
 sts_lai_coast_guard: "海防"
 sts_lai_coast_guard_desc: "以轻舟水手巡弋海疆，海防强而商路稍阻。"
 sts_lai_tribute: "封贡"
 sts_lai_tribute_desc: "以海上封贡维系名分，外交声望提高，但财政需让利。"
 sts_shu_salt_iron_advance: "蜀·天府盐铁"
 sts_shu_salt_iron_advance_desc: "益州沃野，天府之国。蜀王据成都、控汉中，盐铁茶帛之利冠绝南方。"
 sts_shu_law: "蜀地财计"
 sts_shu_law_desc: "蜀道艰难，府库充盈。盐铁、农桑与商路决定蜀王能否出川。"
 sts_shu_state_monopoly: "盐铁官营"
 sts_shu_state_monopoly_desc: "盐铁归官，府库与军资充足，但商民与阶级不满。"
 sts_shu_agriculture: "天府农桑"
 sts_shu_agriculture_desc: "修都江堰、劝农桑，税入与粮道稳固，工矿稍弱。"
 sts_shu_silk_road: "蜀锦商路"
 sts_shu_silk_road_desc: "以蜀锦茶马通商，贸易大兴，军备稍弛。"
 sts_jin_taihang_advance: "晋·太行之脊"
 sts_jin_taihang_advance_desc: "上党高绝，居天下之脊。晋王退守太行之巅，据上党以建王都，扼太行天险。"
 sts_jin_law: "晋地军政"
 sts_jin_law_desc: "晋国夹在太原元军与河南梁军之间，北向、南向与守险三条路。"
 sts_jin_fortress: "太行壁垒"
 sts_jin_fortress_desc: "深沟高垒，凭太行天险自守；代价是机动与税赋。"
 sts_jin_north: "北向复晋"
 sts_jin_north_desc: "克复太原、还我晋阳，动员强而府库空。"
 sts_jin_south: "南下勤王"
 sts_jin_south_desc: "出天井关南下勤王，士气与战争承受力强，太行为空。"
 sts_wu_jiangzuo_advance: "吴·江左正统"
 sts_wu_jiangzuo_advance_desc: "江东沃土，自古帝王之州。吴王为太祖嫡脉，据建康、领江东，水师冠绝天下。"
 sts_wu_law: "吴地国策"
 sts_wu_law_desc: "吴王据长江天险与东南财赋，是尊宋、自立还是联藩，决定江左命运。"
 sts_wu_orthodox: "江左正统"
 sts_wu_orthodox_desc: "以太祖嫡脉自居，正统与外交得利，商税稍抑。"
 sts_wu_navy: "水师"
 sts_wu_navy_desc: "扩建建康水师，重船与海军强，陆军稍弱。"
 sts_wu_commerce: "商税"
 sts_wu_commerce_desc: "以东南商税养国，府库充盈，正统与士绅不满。"
 sts_chu_xianghan_advance: "楚·襄汉铁闸"
 sts_chu_xianghan_advance_desc: "汉水滔滔，九省通衢。楚王世镇襄阳，据襄汉绝险，为南方诸藩之枢机。"
 sts_chu_law: "楚地军政"
 sts_chu_law_desc: "楚王据襄阳，北瞰中原、西联巴蜀、东蔽吴越，守险与北上不可兼得。"
 sts_chu_fortress: "襄汉要塞"
 sts_chu_fortress_desc: "加固襄阳、荆门、安陆，防御极强而机动受限。"
 sts_chu_navy: "江汉水师"
 sts_chu_navy_desc: "以江汉舟师控扼汉水、长江，水军强而陆战稍弱。"
 sts_chu_north: "北上勤王"
 sts_chu_north_desc: "出方城隘道北上勤王，纪律与战争承受力强，襄汉防御稍空。"
 sts_han_qinling_advance: "汉·秦岭重关"
 sts_han_qinling_advance_desc: "梁州古郡，枕秦岭而跨巴山。汉王吴氏世镇兴元，扼蜀道北口，号“蜀口长城”。"
 sts_han_law: "汉地军政"
 sts_han_law_desc: "汉王掌天下出入蜀道之总钥，守关、出子午道与锁关自立，三条路决定川陕大局。"
 sts_han_fortress: "蜀口长城"
 sts_han_fortress_desc: "深壁固守秦岭诸关，防御极强而机动受限。"
 sts_han_zhi: "出子午道"
 sts_han_zhi_desc: "提川陕重弩铁卒出子午道，纪律与士气强，秦岭防御稍空。"
 sts_han_autonomy: "锁关自立"
 sts_han_autonomy_desc: "锁死北道、坐享巴蜀膏腴，府库充盈，但天下侧目。"
 sts_yue_maritime_advance: "越·两浙海商"
 sts_yue_maritime_advance_desc: "钱塘形胜，烟柳繁华。越王宗氏世镇杭州，开宁波、温州巨港，两浙市舶利通万国。"
 sts_yue_law: "越地海政"
 sts_yue_law_desc: "越国以市舶富甲天下，市舶、水师与保境三条路决定两浙命运。"
 sts_yue_shipping: "市舶通商"
 sts_yue_shipping_desc: "开宁波、温州巨港，通商万国，府库充盈而陆军兵源受限。"
 sts_yue_navy: "两浙水师"
 sts_yue_navy_desc: "以海鳅巨舰与两浙棹卒纵横东海，水军强而陆战稍弱。"
 sts_yue_guard: "保境安民"
 sts_yue_guard_desc: "固守钱塘、安抚两浙，税入与防御稳固，但对外声名稍损。"
