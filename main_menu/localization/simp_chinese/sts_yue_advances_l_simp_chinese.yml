l_simp_chinese:
 sts_yue_jiezhi_advance: "节制百粤"
 sts_yue_jiezhi_advance_desc: "广州直辖之境虽非广袤无垠，然自五代南汉建都、大宋设经略安抚司以来，番禺城便一直是统领岭南山海诸邦的宗府中枢。\n\n周遭各州藩镇虽割据一方，名义上皆受粤王节制，岁岁需按律向广州行在解送珠玑、香药、盐铁与银钱方物。凭借世代相传的羁縻统御手腕，粤王府对各路属国的赋税截留与贡品征调轻车熟路，在以王师威权庇护诸藩的同时，亦稳稳将南岭各郡的财赋血利抽纳于自身府库之中。"
 sts_yue_zongmeng_advance: "岭南宗盟"
 sts_yue_zongmeng_advance_desc: "岭南山水虽被割裂为数路藩邦，然周边各镇节帅与府道将门，多与广州王室有着数世不绝的宗支源流与通婚之约。五代南汉立国以来的血脉遗绪，让各方属侯在宗法大义上皆共奉番禺为大宗。\n\n我们应当充分依托在宗亲体系中的尊崇地位与血统纽带，以家国一体之礼法统摄四邻诸侯，牢固确立粤王府在百越之地的核心领导权，从容驾驭更多藩服属国。"
 sts_yue_wubian_advance: "南岭武弁"
 sts_yue_wubian_advance_desc: "在平定与收编周边割据势力的征战中，大批旧日地方土豪的基业被收归王府统辖。我们将这些膏腴产业颁赏给真正敢战能战之士，由此在南岭缔造出一个对王室高度忠诚的新兴武士军阶。\n\n‘有恒产者有恒心’。受封庄田的精锐勇士在阵前斗志如狂、进退无惧，以极其炽热的沙场豪气彻底洗刷了南方军队往日的疲软散漫，令四方诸侯闻风胆落。"
