 STS_HDR_WARLORDS: "群雄割据"
 STS_HDR_WARLORDS_SUB: "藩镇林立，天下无主"
 STS_HDR_GREENTURBAN: "绿巾军起义"
 STS_HDR_GREENTURBAN_SUB: "中原鼎沸，元祚将倾"

