 sts_cn_ruler_county: "刺史"
 sts_cn_ruler_kingdom: "亲王"
 sts_cn_ruler_chancellor: "丞相"
 sts_cn_ruler_emperor: "皇帝"
 sts_cn_ruler_xuanfushi: "宣抚使"

 # ---------- 开局统治者 ----------
 sts_name_zhao_chengsi: "赵承嗣"
 sts_name_guo_yanzhao: "郭延昭"
 sts_name_yang_shouqian: "杨守谦"

 # ---------- 挟天子相关行动 ----------
 sts_claim_chancellorship: "自领丞相"
 sts_claim_chancellorship_desc: "宋廷在你的领地内，天子便在你手里。既挟天子，便该由你执掌朝政——一纸自署，天下诸侯纵有不服，也只能先问你身后的兵甲。"
 sts_edict_of_punishment: "下讨贼诏"
 sts_edict_of_punishment_desc: "以天子之名，昭告天下：某镇不奉朝命，罪在不赦。诏书一下，王师即出——但所有藩镇都会因此离心，外交声誉也会受损。冷却三年。"
 sts_edict_target: "选择讨伐对象"

 sts_declare_traitor_action: "定贼臣名分"
 sts_declare_traitor_action_desc: "不必动兵。一纸诏书，把对方钉在乱臣贼子的位置上——威望、正统、人心，都会跟着一起塌。"
 sts_traitor_target: "选择问罪对象"

 # ---------- 修正名称 ----------
 STATIC_MODIFIER_NAME_sts_holding_emperor: "挟天子"
 STATIC_MODIFIER_DESC_sts_holding_emperor: "朝廷在你的掌握之中。政令由你而出，赋税由你而征，但天下人也因此看清了你是谁。"
 STATIC_MODIFIER_NAME_sts_condemned: "奉诏讨伐"
 STATIC_MODIFIER_DESC_sts_condemned: "朝廷已下诏讨伐此镇，其声名受损，邻镇可持诏出兵。"
 STATIC_MODIFIER_NAME_sts_declared_traitor: "贼臣"
 STATIC_MODIFIER_DESC_sts_declared_traitor: "被朝廷明确定为乱臣贼子。威望与正统俱损，号令难出府门。"

 # ---------- 宋廷建筑 ----------
 sts_song_court: "宋廷"
 sts_song_court_desc: "宋室南渡之后又北还旧都。宫室虽在，诏书却出不了城门——这座朝廷的一举一动，都取决于城门外那支军队的主人。"

