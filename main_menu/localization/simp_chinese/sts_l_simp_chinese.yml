 CHANCELLOR_CHINA_MALE: "丞相"
 CHANCELLOR_CHINA_FEMALE: "女丞相"
 sts_cannot_attack_emperor_tt: "不可对天子宣战"
 sts_chancellery: "丞相府"
 sts_chancellery_desc: "天下无主，唯兵强者为政。丞相一职，名义上总揽朝政，实际上不过是最强的那一路诸侯给自己加的头衔。"
 sts_son_of_heaven: "天子"
 sts_warlord_state: "藩镇"
