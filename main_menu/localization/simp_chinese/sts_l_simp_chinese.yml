 # ---------- 称王建国 ----------
 sts_declare_kingdom_xbw: "称王建国"
 sts_declare_kingdom_xbw_desc: "汴梁据中原之枢，兵甲已足。是时候摘下节度使的旗号，告于天地，正位称王了。"
 sts_declare_kingdom_xbw.a: "建号曰梁"

 sts_declare_kingdom_zhy: "称王建国"
 sts_declare_kingdom_zhy_desc: "彰德扼太行东麓，山河表里。府库既盈，当效魏武之志，建号一方。"
 sts_declare_kingdom_zhy.a: "建号曰魏"

 sts_declare_kingdom_hyn: "称王建国"
 sts_declare_kingdom_hyn_desc: "淮南据淮泗之利，舟车并集。今甲兵既盛，可正名号，以镇东南。"
 sts_declare_kingdom_hyn.a: "建号曰吴"

 # ---------- 局势行动：称王（三种情形） ----------
 sts_declare_kingdom_a: "挟天子以称王"
 sts_declare_kingdom_a_desc: "宋廷就在你的领地内，诏书用的仍是宋的年号。既已握有天子，何必再等？下一道旨，加九锡、封王爵，天下谁敢说半个不字。"


 sts_declare_kingdom_c: "自立为王"
 sts_declare_kingdom_c_desc: "宋廷已落入他人之手，诏书成了别人的刀。既然求不来名分，那就自己给自己一个——只要直接据有三十城，甲兵自足，何须再看他人的脸色。"
 sts_declare_empire: "称帝"
 sts_declare_empire_desc: "旧日藩王已据州跨郡，甲兵、财赋与名分皆备。新天子既已受禅，天下无主，何必再向他人称臣？"
 sts_return_government: "大政奉还"
 sts_return_government_desc: "宋室倾颓，天子蒙尘。丞相若真有匡扶社稷之心，便当奉还版籍、归政天子，使赵宋重光。"
 sts_core_province: "核心化州县"
 sts_core_province_desc: "把本国已经拥有、却尚未编入核心的州县正式纳入版籍。花费金钱、影响力与正统，换取税收、人力与安定。"
 sts_claim_cb: "索取宣称"
 sts_claim_cb_desc: "对首都所在地区内的一个相邻省份索取宣称。花费金币，获得针对该省的地区征服借口；两年内只能索取一次。以此借口发动的战争，双方只能割取与受让国当前首都同属一个地区的土地。"
 sts_subjugate_neighbor: "招抚邻镇"
 sts_subjugate_neighbor_desc: "以金帛与名位招抚弱小邻镇，使其奉表称臣，成为朝贡之国。"
 sts_consolidation_army: "整军经武"
 sts_consolidation_army_desc: "趁天下未定，整编部伍、修缮武备。十年之内，人力、纪律与补给皆有增益。"
 sts_revere_song: "尊王"
 sts_revere_song_desc: "遣使入朝、修贡奉表，借宋室名分安抚境内士绅，换取影响力、稳定度、正统与声望。"
 STS_HDR_CONSOLIDATION: "海内整合"
 STS_HDR_CONSOLIDATION_SUB: "三年内，吞并、招抚、核心化"
 STATIC_MODIFIER_NAME_sts_consolidation_army_modifier: "整军经武"
 STATIC_MODIFIER_DESC_sts_consolidation_army_modifier: "部伍整编、武备修缮，人力、纪律与补给皆有所增强。"
 STATIC_MODIFIER_NAME_sts_hegemon_top3: "海内三雄"
 STATIC_MODIFIER_DESC_sts_hegemon_top3: "三年整合期届满时最强大的三家势力，获得号令群雄的威望、正统与动员优势。"

 sts_controls_entire_area_tt: "完整控制该地区（含附属国）"
 sts_controls_any_whole_area_tt: "完整控制任意一个地区（含附属国）"

 # ---------- 受禅称帝 ----------
 sts_receive_mandate: "受禅称帝"
 sts_receive_mandate_desc: "宋廷在你的领地内，而你是相府之主。玉玺、郊庙、百官、诏书——一切都齐了，只差一个名分。是时候让那个坐在宫里的孩子把天下让出来了。"

