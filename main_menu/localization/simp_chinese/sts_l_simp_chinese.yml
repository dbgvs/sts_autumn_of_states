 # ============================================================
 # 万邦之秋 / Autumn of Ten Thousand States
 # P1 本地化
 # ============================================================

 # ---------- 势力名 ----------
 XBW: "汴梁"
 XBW_ADJ: "汴梁"
 ZHY: "彰德"
 ZHY_ADJ: "彰德"
 HYN: "淮南"
 HYN_ADJ: "淮南"

 # ---------- 群雄割据 ----------
 sts_warring_states: "群雄割据"
 sts_warring_states_desc: "靖康之后，宋室北复中原，却未能守住这场胜利。百余年来，节度使、宣抚使、团练使各自为政，朝廷的诏书出不了开封城门。如今中原大地藩镇林立，谁都看得出——旧秩序已经死了，而在新秩序诞生之前，会有很多人先死。"
 sts_consolidation: "海内整合"
 sts_consolidation_desc: "天下无主，藩镇各据州郡。局势开始后的三年，是吞并、招抚与核心化的窗口；谁能把新得之地真正编入版籍，谁才有资格谈下一场天下之争。"
 sts_consolidation_hegemon: "霸主崛起"
 sts_consolidation_hegemon_desc: "一方诸侯已直接据有百城，足以左右周边诸镇的存亡。各镇争夺州县的局面至此告一段落，接下来的争斗，将由大国主导。"
 sts_consolidation_annihilated: "诸夏覆灭"
 sts_consolidation_annihilated_desc: "最后一个藩镇也已消失。曾经林立中原的诸夏衣冠，最终没能留下一个自己的名字。"
 sts_consolidation_continue: "争霸继续"
 sts_consolidation_continue_desc: "三年期满，各镇已将邻境的州县重新分过一遍，天下却仍未有共主。最强的三家声势渐成，此后的胜负，仍要由刀兵来决定。"

 sts_warring_states_unified: "海内归一"
 sts_warring_states_unified_desc: "天朝已有共主，其直领与附庸已控天朝故土三分之二以上。群雄尽灭，天下重归一统。开封城头的旗帜换了颜色，而城中百姓只关心明年的赋税由谁来收。"

 sts_legend_warlord: "藩镇"
 sts_legend_song_court: "宋廷"

 # ---------- 绿巾军起义 ----------
 sts_green_turban: "绿巾军起义"
 sts_green_turban_desc: "元廷退守塞外已近百年，却仍以中原之主自居。辽阳、河西、燕云的土地养不活塞外来的王公，也养不活世代耕种的汉人。当河工挖出那只独眼石人时，绿巾便如野火一般烧遍了北方的官道。"

 sts_green_turban_yuan_restored: "元室中兴"
 sts_green_turban_yuan_restored_desc: "绿巾散尽，官军的旗帜重新插上城头。元廷证明了自己还有力气挥刀——至少这一次。"

 sts_green_turban_yuan_retreats: "元帝北狩"
 sts_green_turban_yuan_retreats_desc: "大军出关，宫车北行。元廷带走了玉玺、史册和最后一点体面，把关内的城池留给了那些曾经跪着听诏的人。"

 sts_legend_yuan: "大元"
 sts_legend_green_turban: "绿巾军"

 # ---------- 宣战借口 ----------

 # ---------- 提示 ----------
 sts_song_court_relocates_tt: "宋廷失去土地，成为依托宫室存在的朝廷"

