 sts_liang_guard_reform.1.title: "洗汰禁兵：铁甲尽属相府"
 sts_liang_guard_reform.1.desc: "宣德门外的大校场上，初春的风沙卷起阵阵肃杀之气。\n\n三百斤金铤与满箱满匣的足色会子被相府甲士一字排开，重重砸在校场泥土之中。东京开封府名义上的“八十万禁军”，早已在百余年的虚耗与近臣中饱私囊下腐朽不堪——名籍上虽列数十万之众，点将台上站出来的却尽是混充市井、面黄肌瘦的老弱病残；武库里的皮甲朽烂生蠹，铁枪锈迹斑斑。若逢外藩异动，这支天子亲军莫说出关平叛，连守卫京畿城郭都是痴人说梦。\n\n点将台正中，当朝宰执按剑而立，面容冷峻。随着政事堂军令下达，相府多年来招募蓄养的淮军精锐与心腹宿将悍然踏入校场。\n\n洗汰冗弊的雷霆手段没有给京营旧官僚留下任何情面：\n\n凡年迈残弱、挂名冒饷者，当场发放度牒赏钱遣散归乡；冒领空饷之贪将中官，立斩于辕门之下，首级高悬示众；从淮地各营调来的百战悍卒整编入殿前司与侍卫司各厢，三万副崭新的冷锻步人甲与神臂弓破库而出，分发全军。\n\n远处皇城楼阁之上，凭栏俯瞰的小天子望着城下银甲照日、刀枪如林的铁阵，双手止不住地颤抖。原本护卫深宫的天子近卫，如今从军都指挥使到营伍虞候，尽皆换成了对相府指天誓日的虎狼心腹。\n\n真金白银散尽，汴梁城头换了一副筋骨。从今日起，这开封禁军不再是皇权的摆设，而是真正能让关东、关西诸侯闻之色变的相府刀锋！"
 sts_liang_guard_reform.1.a: "天子亲军？自今日起，唯遵相府钧令！"
