l_simp_chinese:
 sts_jin_jintang_advance: "表里金汤"
 sts_jin_jintang_advance_desc: "左带太行之险绝，右绕黄河之天堑，三晋军旅是在世代戍守北疆与锁闭关东的烽火中淬炼而成的。\n\n在这片表里山河之间，严苛的塞上行伍之法铸就了将士坚忍如铁的严明纪律；而星罗棋布于太行八陉与雁门群峰间的重关险堡，更在我军手中连成锁闭山河的森严防线。士卒守阵如钉，城池固若金汤，令天下窥伺中原者望峰息心。"
 sts_jin_yicong_advance: "雪耻义从"
 sts_jin_yicong_advance_desc: "故都太原沦陷之耻未雪，汴梁权臣窃国之恨又添，三晋大地早已怒火如荼。面对这倾天大难，我们不再依靠那些随风倒向的外邦勇力与虚名冗卒，而是将目光投向了太行深山中坚韧剽悍的本乡百姓。\n\n耕作于悬崖梯田间的农夫猎户，平日荷锄自给，战时闻鼓而起。一套遍布山野的保甲乡勇之制，让晋国得以向所有深怀国恨的臣民大举征兵。太行绝顶之上，万千死士正执戈待命，只待王令一下，便可自绝壁呼啸而下！"
 sts_jin_tielu_advance: "三晋铁旅"
 sts_jin_tielu_advance_desc: "古之治军，莫尚于严整；临阵对敌，重在百步不乱、三十步乃发。面对四邻敌藩仓促杂乱的抛射，我军阵型如堵、行进步调如一。\n\n敌远不攻，敌近则倾其全力，于短距之间以密集矢石穿甲破骨；未待敌阵从震骇中回过神来，万千铁甲甲士已挺枪挥刃碾压而上。唯有敢于直面刀枪相见者，方配为主宰中原之雄主。"
