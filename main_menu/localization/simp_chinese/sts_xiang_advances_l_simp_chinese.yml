l_simp_chinese:
 sts_xiang_taoyuan_advance: "武陵桃源"
 sts_xiang_taoyuan_advance_desc: "自昔年晋人避乱探访武陵源起，湘资群山深处便一直是海内生民梦寐以求的避祸乐土。\n\n如今关东中原再度陷入藩镇兼并、兵火连天的杀戮浩劫，而坐拥洞庭北障、山川膏腴的湖湘大地，便成了天下底层流民寻觅安宁与饱暖的最终归宿。无数渴望逃离饥馑与战火的迁徙百姓汇聚于此，在此辟土垦殖、兴市繁衍生息，使湘中大地炊烟日盛，月月皆呈祥和繁荣之象。"
 sts_xiang_tiebu_advance: "湘铁重步"
 sts_xiang_tiebu_advance_desc: "盲目效仿北方胡骑冲锋，不过是自寻死路。湘中群山阻绝，与其在马背上虚耗力气，不如将每一两精铁都穿在健硕的湘卒身上。\n\n湘军自成一体的操典严明：马匹只作转运之用，接战前夕全军下马整阵。万千披挂重甲的重步结成铁阵缓缓向前碾压，长枪如林、大斧翻飞。任凭天下诸侯起倾国铁骑撞击而来，皆如蚍蜉撼树，必在我坚固步阵前撞得粉身碎骨！"
 sts_xiang_quecha_advance: "榷茶通商"
 sts_xiang_quecha_advance_desc: "昔年武穆王马殷开基南楚，深知湖湘群山不宜纵马，却最宜植茶，遂定下“辟山种茶、轻税利商”之国策。百余年来，湘资两水沿岸“山山有茶园，户户习焙制”，安化黑茶与衡岳云雾甲于天下。\n\n湘王府设立茶务司统理榷茶大计：官府定等级以立市信，任由四方商贾结伴入山采运，关隘仅收微赋而不留难。每逢春茶采毕，万顷茶舟破洞庭湖水顺江北上，不仅以碧玉般的干茶换回中原的金银财帛与关陇的健硕良马，更让长沙榷货坊肆日进斗金，使湘国府库充盈，无虞兵饷之匮。"
