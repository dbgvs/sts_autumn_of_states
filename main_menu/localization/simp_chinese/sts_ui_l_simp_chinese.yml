 sts_fanwang_levy_policy: "相府藩屏联防"
 sts_fanwang_levy_policy_desc: "丞相府成员遭组织外势力进攻时，具备参战资格的丞相与藩王可依本法响应援助；受袭国不会收到援助自己的召集。藩王拒援只损威望，丞相拒援另损正统、政治影响力与相府成员好感。"
 sts_defense_levy.1.title: "相府成员求援"
 sts_defense_levy.1.desc: "丞相府成员正遭组织外势力进攻，使者依相府联防法前来求援。身为藩王，我们可以响应出兵，也可以拒绝援助；此事关乎组织成员间的联防，并非奉诏勤王。"
 sts_defense_levy.1.a: "应召出兵，共御外敌。"
 sts_defense_levy.1.b: "拒绝应召，只损威望。"
 sts_defense_levy.2.title: "相府成员求援"
 sts_defense_levy.2.desc: "丞相府成员正遭组织外势力进攻，使者依相府联防法请求丞相援助。我们可响应出兵，加入受援国一方共同防御，也可拒绝并承担背弃联防义务的代价。"
 sts_defense_levy.2.a: "率相府驰援。"
 sts_defense_levy.2.b: "拒绝应召。"
