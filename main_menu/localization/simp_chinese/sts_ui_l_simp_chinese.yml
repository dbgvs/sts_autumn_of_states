 STATIC_MODIFIER_NAME_sts_liang_qingjunce: "清君侧"
 STATIC_MODIFIER_DESC_sts_liang_qingjunce: "传檄天下、整军勤王的动员令。淮军士气正盛，但天下诸侯也因此看清了梁的野心。"
 STATIC_MODIFIER_NAME_sts_liang_canal: "通漕江淮"
 STATIC_MODIFIER_DESC_sts_liang_canal: "汴梁与江淮漕运重新贯通，粮秣、商货与税赋顺流而至。"
 STATIC_MODIFIER_NAME_sts_liang_imperial_guard: "整编禁军"
 STATIC_MODIFIER_DESC_sts_liang_imperial_guard: "以淮军骨干整编开封禁军，兵甲、粮饷与操练皆归丞相府节制。"
 sts_liang_clear_throne.title: "清君侧"
 sts_liang_clear_throne.desc: "丞相府传檄天下，斥诸侯挟私、权臣乱政，以淮军为骨干整军勤王。此举可鼓舞军心，但也让梁的野心彻底暴露。"
 sts_liang_clear_throne.a: "传檄天下，整军勤王。"
 sts_liang_open_canal.title: "通漕江淮"
