 sts_consolidation.1.title: "勘界均定敕"
 sts_consolidation.1.desc: "盖着东京中书门下朱红大印的黄牒，今日加急递入了镇中幕府。\n\n自官家深居禁中、相府独揽乾纲以来，天下百八十九镇早已形同异国。各地疆界犬牙交错，版籍图经尘封废弛，互夺渡口、私设税卡乃至陈兵越境的私斗无日无之。弹劾邻藩的奏疏在政事堂案头积压如山，然而朝廷帑藏空虚、禁军唯足自卫京畿，哪还能派得出一兵一卒来为外藩仲裁是非？\n\n如今这道黄牒，便是相府张嵩给天下的答复：命各路藩镇于三载之内“自勘嫌隙、厘清境线”，期满之后，重绘鱼鳞图册呈送中书省备案。\n\n幕僚僚属皆心知肚明——这文书看似劝和修疆，实则是朝廷无力统御之下，索性放任海内群雄各凭刀枪争夺地盘。邻镇今日想必也收到了同一封盖印的公文。在这大争之秋，旧日疆界早已庇护不了安宁；若不抢先吞并四邻，他日呈上帝京的版籍之上，恐怕就再无我等立锥之地。\n\n三年为限，此乃开疆拓土之良机，亦是生死存亡之关隘。若有某路豪杰能在此乱局中兼并逾百处关隘州县，这盘神州残棋，恐怕便要提前决出胜负了。"
 sts_consolidation.1.a: "发牒聚将！且用手中刀兵，与四邻重新画一画这疆界。"
 sts_consolidation.2.title: "驱虎定疆策"
 sts_consolidation.2.desc: "东京汴梁，政事堂西阁深夜未熄。\n\n案几之上，数百份来自各路节度使与分封诸侯的告急文书层叠堆积：关中指责河东越境争盐、齐莱水师争夺海口税课、两浙与荆湖因一座浮桥私兵相向……深宫里的少年天子连出阁祈雨都要看相府脸色，朝廷府库岁入十之八九截留在外，禁军不过数万精锐，如何能管得了这普天之下的一百八十九路跋扈诸侯？\n\n若相府一味敷衍仲裁，非但徒劳无功，反而徒耗中枢威信。与其四处灭火，不如索性借风放火。\n\n张嵩提起朱笔，在敕书上冷峻写下中书省的决断：通令海内诸藩，限期三年“自正疆域、勘定图籍”，三年期满，以既成疆界重造天下黄册。\n\n这一纸敕令散发天下，无异于将生肉抛入狼群。四方藩镇本就互怀戒心，得此明诏，必尽起爪牙与邻近死敌争夺州县。三年之内，互相攻伐消耗的是诸侯的骨血与私帑，而相府端坐汴京，坐山观虎斗。待到天下弱肉强食初定、藩镇死伤疲弊之时，朝廷再持法度以平定残局，收各镇之权。\n\n“且放他们去争去抢。”张嵩放下朱毫，目光投向殿外东京的夜空，“只是须得看紧那些跨州连郡的雄藩……若真有人三年之内强夺百处咽喉，相府的神机营与禁军，就该动一动了。”"
 sts_consolidation.2.a: "明诏已发，纵彼相残。待海内疲弊，自是由相府收拾山河。"
