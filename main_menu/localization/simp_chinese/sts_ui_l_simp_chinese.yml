 sts_liang_open_canal.a: "拨银疏浚漕路。"
 sts_liang_reform_guard.title: "整编禁军"
 sts_liang_reform_guard.desc: "以淮军宿将整编开封禁军，淘汰老弱、补足甲械，使禁军真正成为丞相府手中的刀锋。"
 sts_liang_reform_guard.a: "整编禁军。"
 sts_chancellery_palace: "丞相府"
 sts_chancellery_palace_desc: "开封中枢，丞相开府治事、总百揆、号令天下之处。"
 sts_imperial_guard_camp: "禁军大营"
 sts_imperial_guard_camp_desc: "淮军骨干与开封禁军的整编营地，甲械粮饷皆聚于此。"
 sts_country_history_CHI: "塞北雄庭，东尽辽海，西跨流沙，南临河湟。自成吉思汗以铁骑启业，忽必烈承大统、建元号，取天下于宋金之间，疆理之广，古所未有。\n\n然百年以来，国步渐艰。帝位屡迁，权臣相继，朝纲纷扰于上，郡县困穷于下。蒙古、色目、汉人、南人之间，情异而俗殊，法令虽同而心迹相隔。水旱频仍，赋役日重，河工之役疲弊万民，奸雄之徒啸聚山泽。\n\n今大元虽拥北方之众，威令已衰于州郡。辽东、晋北、陕西诸将，各拥强兵，外示尊王，内图自固。关河以南，赵宋犹存；汉沔之间，藩镇棋布。天下之势，已非昔日混一之盛。\n\n或谓大元当奋兵南下，收宋境而一四海；或谓宜先安内镇，抑群将、治财赋、息民力。成败兴亡，皆在今日。"
 sts_country_history_KFE: "大梁旧壤，天下中枢，开封为历代帝王之都。宋室绵延三百载，文治冠于海内，然岁久弊生，内难迭起。及至乾和年间，京师禁军内讧，宫室焚掠，天子蜡诏征天下勤王。淮东梁国公张嵩起于两淮将门，世受国恩，以清君侧为名提两万淮军昼夜入京。\n\n入城之后，张嵩诛乱军、安百官、封府库，旋即接管京畿防务、整编禁军。他既不弑君、亦不废帝，只以隔绝奸佞为名幽囚天子于深宫，奏章诏旨皆出相府，天子唯存盖印之权。翌年，天子被迫拜其为大丞相、总百揆，开丞相府，加九锡，入朝不趋、赞拜不名、剑履上殿，人臣之礼至此而极。\n\n天下皆知张嵩有窥伺神器之心，然其挟天子以令诸侯，据开封府库、握中原腹心，势成骑虎。关中岳氏秦王传檄声讨，齐、莱诸藩或闭关观望，或阴蓄异志。北有大元虎视河朔，南有州郡各怀心思。张嵩若能压服群雄，则可重整宋祚；一旦诸侯联兵叩关，大梁便为天下血战之所。"
 sts_country_history_JIN: "海岱之间雄邦，古齐旧疆。故地，韩氏承忠烈之遗绪，世袭齐王，镇治青州。先祖韩家乃韩世忠横戈江上之后，扬威于大江惊涛；韩家一脉虽徙封青州，不忘承数百年武略，步骑精强风，兼习舟师。控三齐雄镇平原，东接莱王通胶东海疆港，西临济连大河。当此宋室板荡之时，东方藩镇举足轻重。齐王封土韩承烈手握齐甲，可西出以应讨梁之檄，南望淮泗亦可闭关守境，北抵静观中原风云。大河朔以东的命运，系于此藩一念之间。\n\n中原鼎沸，张嵩挟主于开封，秦王传檄于关中。齐王雄踞山东腹地，为东方藩镇之砥柱。他可挥师西向，赴勤王之盟，与岳、吴诸藩共清君侧；亦可按兵不动，坐观天下胜负，凭齐地膏腴，自保封疆。"
 sts_country_history_XIA: "秦川四塞，古称陆海，八百里关中屏蔽中原。靖康之难后，武穆王岳飞再造社稷、收复河山，绍宋中兴天子感其忠烈，旌表殊勋，特许岳氏子孙世袭秦王，世镇京兆，永为西北长城。自此百余年间，岳家一脉坐镇长安，统永兴军路，扼潼关、镇陇右，麾下秦甲劲旅北拒金虏、西备羌戎，关中号为天下精兵所出之地。\n\n至乾和年间，京师大乱，禁军内讧，宫室焚掠，天子蜡诏征天下勤王。淮东梁国公张嵩以勤王为名提兵入京，乱平之后却盘踞京师不归，幽囚天子于深宫，开丞相府、总百揆、加九锡，自此诏令皆出相府，天子唯存盖印之权。权臣秉政，天下侧目。\n\n秦王不肯屈膝事权，据关自守，传檄四方，斥张嵩挟主弄权、阴怀篡夺之志，号召山东诸藩共清君侧、复乾纲。然秦地危局并存：北有大元重兵窥伺河湟，西有陇右诸羌叛服无常，东出潼关即为张氏腹心。秦王若联齐、莱、河东诸藩并力东向，则勤王可成；若诸侯各怀异志、师出迁延，则关中孤悬，恐为北虏所乘。关中之向背，实系宋室兴亡。"
 sts_country_history_DAD: "东方海隅，古莱旧壤。赵氏莱王世袭镇登、宁海，扼胶东半岛，坐拥登州巨港。\n\n此地群山环海，舟楫通达辽东、高丽，市舶往来不绝，府库赖海商以充盈。莱王掌一支近海舟师，为大宋东北海上门户。\n\n中原鼎沸之际，海疆隔绝，进退皆可浮海。虽名义尊奉开封天子，然半岛孤悬大海，唯保境安民为首要。"
 sts_country_history_CAJ: "益州沃野，天府之国。自绍宋中兴，赵氏宗室世袭蜀王，代镇成都，统成都府、蜀州、剑州、潼川、遂宁诸郡，兼领汉中，屏蔽西南。四塞之地，外有剑阁、三峡之险，内有都江之利，金元之际蒙古铁骑屡犯西陲，皆不能越此天险而入。\n\n至乾和年间，京师大乱，梁国公张嵩以勤王为名入京，幽囚天子、开丞相府、加九锡，权倾朝野。蜀王赵寻承宗室之重，握巴蜀之富，然蜀道艰难，兵马出川不易，故不轻举，闭关自守，坐观中原之变。\n\n蜀地府库充盈，盐铁茶帛之利冠绝南方，兼控汉中，北可窥伺关中，东可顺江出三峡以叩荆襄。赵寻若从秦王之檄，提巴蜀之众顺江东下，则可成夹击开封之势；若坐守四塞、静观其变，亦可保蜀中百年基业。蜀王向背，实为南方诸藩之枢机。"
 sts_country_history_LAK: "上党高绝，居天下之脊，俯瞰中原。自绍宋中兴以来，太行山险便是赵宋抗御塞北铁骑的最后屏障。当年太行信王奉诏分镇河东，率忠义八字军转战崇山之间，屡抗强胡。然大元席卷漠南、尽吞金土，数十年倾国南侵，太原晋阳古城终陷于敌手。危急之际，晋王世系退守太行之巅，据上党以建王都，扼辽州、沁州为两翼，屯重兵于霍山雀鼠谷之险，阻绝汾晋之冲。残晋诸州虽不过数郡之地，然凭山川之高峻，深沟高垒，数十年间令大元铁骑寸步难下，为后宋死死守住了北境的天堑天门。\n\n乾和岁变，中枢板荡。梁国公张嵩以淮军窃据汴京，挟持天子，开府秉政，宗社陵夷。当代晋王赵崇岳身为太宗正统之后、塞北宗室砥柱，闻变按剑而起。上党南下即是河南平原，晋兵出天井关旬日可薄汴梁城下，如高屋建瓴；然其身后，大元重兵正盘踞太原，自晋中盆地虎视眈眈，太行关隘旦夕烽火不绝。全藩军民皆以“克复并门、还我晋阳”为世仇夙愿，若抽兵南向勤王，恐北虏乘虚蹈险，断绝太行根基。\n\n故都沦亡之耻未雪，权臣窃国之恨又添。晋王究竟当北向决死、挥师克复太原以安祖宗魂魄；亦或提太行死士自绝壁呼啸而下，靖中原之国难，自正九五之尊？太行绝顶之上，万千甲士正待王命。"
 sts_country_history_YAF: "江东沃土，自古帝王之州。建康控扼大江天险，钟山龙蟠，石头虎踞；三吴平原水道纵横，苏常膏腴之利甲于海内。自绍宋中兴以来，朝廷感念太祖开基创业之德，特开府建康，封太祖嫡派子孙世袭吴王，总领江东军政财赋。百余年间，吴藩修金陵旧城、治三吴水利，府库岁入半天下之赋。更倚长江万里之险，筑楼船万艘，京口、采石之间旌旗蔽空、甲兵如林，江东水师天下莫敢撄其锋。\n\n乾和岁变，风云骤起。淮东梁国公张嵩提兵入洛，挟主专擅，开丞相府、加九锡，汴京号令已形同伪诏。当代吴王赵崇绪身为太祖嫡脉，居六朝形胜之地，坐拥江南百万仓廪。面对张氏专权与天下纷乱，吴王外示恭顺、岁贡不绝，内则休兵息民、坐观中原成败。江南文士巨商尽归其心，皆谓当年太宗一系得神器三百年，今日遭权臣幽辱，天命当转，社稷正统合该重归太祖子孙。\n\n大江横陈，波涛万顷。吴王是该挥师沿江西上、出大江以正君臣之纲？亦或凭长江天险与东南财赋，在建康重燃南朝烟雨，自登九五、另立乾坤？大江东去，浪淘英雄，江左风流正待新主挥毫。"
 sts_country_history_XAF: "汉水滔滔，九省通衢，荆襄自古为兵家必争之腰膂。自绍宋中兴以来，朝廷为解累朝宗室猜忌之结，特雪魏王赵廷美当年房陵之冤，封其子孙世袭楚王，分镇襄阳，统辖襄阳、荆门、安陆诸州，总制荆汉军政财赋。百余年间，历代楚王加固襄阳坚城、筑荆门隘塞、垦安陆沃野，引汉水为深堑，练水陆十万雄师。江汉之间重楼战舰蔽江而下，金元之际任凭风云变幻，皆不能逾汉水半步，襄汉防线号为天下之铁闸。\n\n乾和岁变，汴京倾颓。梁国公张嵩提淮兵入京，擅专朝政，天子沦为深宫傀儡，关东诸侯侧目。当代楚王赵崇汉承廷美一脉至贵之血，坐镇襄樊绝险之地，北隔南阳而瞰中原腹地，西联巴蜀、东蔽吴越。面对相府矫诏与天下动荡，楚王引兵按剑，深沟自守。张嵩虽握京师甲兵，亦深忌襄阳劲旅北出宛洛直捣其背；天下勤王志士皆寄望楚王能提江汉之兵，与关中岳氏合围汴梁。\n\n汉江北去，关山重重。楚王是该整顿楼船甲骑、出方城隘道以清君侧、诛奸佞；亦或全师保境、坐观中原逐鹿，以待真命所归？江汉巨澜澎湃，唯系楚藩一念之间。"
 sts_country_history_XAB: "梁州古郡，枕秦岭而跨巴山，汉水自此滔滔东去。靖康危局之际，吴玠、吴璘兄弟血战和尚原、扼杀金虏于仙人关，使川陕半壁安如泰山。绍宋中兴天子论功行赏，特命吴氏子孙世袭汉王，开府兴元，统领汉中、阶成、凤陇诸要塞。百余年间，吴氏将门依险筑垒、深壁固守，联络氐羌、屯垦梯田，麾下锐卒兼习神臂巨弩与山地步战，号称“蜀口长城”。大元铁骑数十年纵横漠南西陲，屡窥汉川，皆折戟于秦岭重关险道之下。\n\n乾和岁变，中枢板荡。淮东张嵩以勤王为名篡据汴京，开府专政、幽禁天子。关中岳氏秦王传檄四方，誓师讨逆，力邀吴氏同出关东以清君侧；而南面锦绣天府之蜀王，则深闭剑阁，甘愿以万斛锦粟重金结好汉藩，求其锁死北道、保境自安。当代汉王吴继勋据守秦巴天险，掌天下出入蜀道之总钥，北瞰关中烟尘，南听天府弦歌，西备北虏游骑，东顾汉江风云，势成牵动川陕大局之枢纽。\n\n秦岭巍峨，栈道千盘。汉王是该提川陕重弩铁卒出子午道，与岳氏秦王合兵东向、再造宋室乾纲；亦或锁关自立、坐享巴蜀膏腴之供，成割据称雄之一方霸业？重关千叠，风云皆系于汉王旗鼓之下。"
 sts_country_history_HAS: "钱塘形胜，烟柳繁华，会稽山海环抱东南。自绍宋中兴以来，朝廷为酬靖康元勋挽狂澜于既倒之功，特推恩宗留守一脉还镇桑梓，封宗泽嫡孙世袭越王，开府杭州，统领两浙军政市舶。宗氏祖出金华义乌，百余年间劝课农桑、兴办书院，抚定山越之险；又开宁波、温州巨港，市舶利通高丽、扶桑乃至南洋万国，两浙号为东南乐土。更依海江之利筑造海鳅巨舰万艘，麾下两浙棹卒惯历风涛，纵横东海无有抗手。\n\n乾和岁变，汴京沦亡。梁国公张嵩以淮军窃擅中枢、幽囚天子。开封陷落之报传至杭州，宗氏宗庙震动。当年宗忠简公死守东京孤城，临终连呼三声“过河”以励北伐，天下忠义之士无不涕泣；今东京祖庙沦于叛臣私门，更令两浙军民义愤填膺。当代越王宗良佐文韬武略、承祖遗风，然越地北接江东吴王，吴藩据建康、心存篡僭，随时欲顺江吞并三吴；远洋巨万之资与西湖烟霞之盛，亦消磨不少浙人战心。\n\n沧海浩荡，潮信不绝。越王是该依凭先祖“过河”之血誓，提两浙舟师浮海北上、直指淮泗以诛张贼；亦或固守钱塘江山，凭借富甲天下之市舶财力，在西湖烟柳中静观中原龙蛇陆沉？东南天命，尽系于浙水万叠惊涛之间。"
 sts_country_history_CAQ: "荆楚南偏，湘资并流。自唐末五代马殷受封楚王、建都长沙，开创南楚基业，湖南之地息兵养民、植茶利商，长沙自此号为南方名郡。绍宋中兴以降，朝廷因荆襄已分封诸侯，特诏马氏嫡脉承继故土，世袭荆湖南路安抚司，世镇潭州。历两宋百余年藩镇化之渐，马氏兼统长沙、常德、宝庆、湘乡诸郡，凭洞庭为北障，扼五岭之北关，进封湘王。湘中山川险峻而沃野膏腴，衡岳钟灵，水陆四达，所出湘茶、稻米与铁铸甲仗冠绝江南，麾下湘卒以筋骨强劲、善操长弩硬弓名扬天下。\n\n至乾和之乱，梁国公张嵩开府专权，四海纷扰。湘王马承弼居天下腹心枢机，北有荆江强楚虎视洞庭，西有五溪诸蛮叛服不常，南与两广粤王隔南岭相对。关中秦王传檄勤王，使者络绎于道；开封相府亦遣官降旨、许以厚赏。然而长沙四塞虽险，亦为兵家必争之冲。中原动荡之际，马承弼深沟高垒，固守常德隘口，坐镇江潭以待时变。\n\n湘地民风剽悍，水陆兼资。马承弼若出常德、顺流横渡大江以图荆襄，则可动摇大梁腹背；若引兵南越骑田、大庾二岭，亦可席卷百越富庶之境。然若诸侯合兵进逼、荆楚挥师南渡，则湘中沃土亦将沦为中原混战之血场。湘王之一进一退，实系江淮以南天下棋局之关窍。"
 sts_country_history_GAI: "五岭以南，三江汇海。自唐末五代南汉刘氏肇建越邦，定鼎广州，百余年间舟楫通达四夷。绍宋中兴之后，朝廷因势利导，特诏刘氏嫡脉承领广南东路节度使，世镇番禺。两宋三百年以降，刘氏坐拥广州市舶巨利，重洋巨舶往来于波斯、大食、三佛齐诸国，香药犀象、珠玑象齿堆积如山，榷税之饶甲于海内，珠三角膏腴沃野更兼鱼米之利。乾和年间，刘氏进封粤王，建牙开府，分封外郡，南恩、肇庆、英德、惠州诸州皆奉表称臣，俨然为岭南共主。\n\n至中原板荡，梁国公张嵩开府专权，秦王传檄四方勤王。南岭天堑阻隔风云，粤王刘崇海内驭英德、肇庆诸附庸以锁五岭咽喉，外督珠江舟师水寨以巡弋大洋。刘氏深知中原血战方兴未艾，北军铁骑纵横却苦于江淮湿热、不习水战，纵使天下大乱，狂澜亦难越梅关一步。\n\n粤王府库堆金叠玉，麾下更募有惯习水性之疍户健儿及善用佛郎机火器的番夷铳士，军械水师称雄南海。张嵩之威逼、秦王之结纳，皆欲借岭南泼天之财以充军饷。刘崇海若仗巨舰航行四海、资助一方，则可倾覆天下平衡；若紧闭关隘、坐守五岭，亦足称孤道寡于南海之滨。百越之向背，实系天下钱粮之枢机。"
 sts_country_history_QAB: "八闽封疆，山海回环。自绍宋中兴，朝廷移南外宗正司于泉州，特诏王氏世袭代镇闽疆，统福州、泉州、建宁、漳州、汀州诸郡，兼领市舶。四境之内，北有仙霞关险扼两浙，西阻武夷绝壁以拒江右，东临浩渺重洋。刺桐巨港千帆竞发，梯航万国，大食、波斯、三佛齐番商往来不绝，府库榷税充盈，为大宋海丝利薮所在。\n\n至乾和年间，京师大乱，权臣张嵩幽囚天子、专擅朝政。关中秦王传檄勤王，诸藩各怀异志。闽王承清誉，握梯航泼天之利，坐拥八闽山川之固与万斛巨舶水师。然闽道崎岖，陆师出山不易，中原虽乱，风波难及海隅，闽王因而闭关锁港，不涉中原党争。\n\n闽境赋税虽厚，然外有海寇夷商隐患，内有闽中山民啸聚之虞。张嵩之跋扈、秦王之义檄，皆寄望于东南饷银。闽王若仗舟师之利北航吴会、沿江入淮，则可资百万海利以定江山；若安守仙霞天险、静观天下分合，亦可凭万里惊涛自成海外之国。八闽之进退，实为东南财赋之枢机。"
 sts_country_history_generic: "大宋历经绍宋中兴，延绵三百年国祚，未曾南渡偏安。昔年为御北虏南侵，朝廷改弦更张，将财赋、兵甲与守土之权尽数委于方镇。重重堡寨与世袭将门虽筑成了抵御外侮的铁壁长城，使赵宋独存于草原铁骑的狂澜之下，却也彻底逆转了太祖强干弱枝之法，令天下化作诸侯林立、听调不听宣的裂土之局。\n\n岁久弊生，中枢渐倾。乾和宫变后，丞相梁国公盘踞汴京、开府秉政，天子深居禁中已形同傀儡；北境之外，庞然的大元正虎视山河。面对动荡的九州，本镇是该挥师勤王再正乾纲、依附权相以图苟安，亦或借此乱世逐鹿中原？唯有上天与剑锋知晓天命的归途……"

