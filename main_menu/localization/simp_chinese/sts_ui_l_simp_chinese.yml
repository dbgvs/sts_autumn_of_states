 # ===== 受禅/大政奉还事件 =====
 sts_mandate.1.title: "受禅之后"
 sts_mandate.1.desc: "丞相已受禅称帝，旧日的丞相府在一夜之间散去。新天子遣使来到阶下，问我们是奉表称臣，还是继续举起讨贼的旗帜。"
 sts_mandate.1.a: "奉表称臣，永为新朝藩屏。"
 sts_mandate.1.b: "拒不奉诏，举兵讨贼！"
 sts_mandate.2.title: "大政奉还"
 sts_mandate.2.desc: "丞相已奉还版籍，宋天子重临汴京。旧日相府诸镇各怀心思：是奉表称臣，还是拒认新朝、继续自保？"
 sts_mandate.2.a: "臣服宋室，永为藩屏。"
