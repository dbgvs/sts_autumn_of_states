 sts_name_zhang_lingyi: "令仪"
 sts_liang_present_daughter.title: "进女配极"
 sts_liang_present_daughter.desc: "天子年渐长，中宫虚位，六宫不可一日无主。深宫禁闼之中，宦官宫女出入纷杂，若无得力之人统御内廷，恐生宵小窃发、密通外藩之祸。\n\n相府长女柔嘉淑慎、恪遵闺门之训，正合母仪天下之选。政事堂已代中书舍人拟就大婚合卺之明诏。命有司具九凤仪仗、采和阗美玉刊刻皇后金宝玺册。此举既定，六宫内外尽为相府耳目，深宫帝脉，自此血归张氏。"
 sts_liang_present_daughter.a: "命有司备仪，进女配极。"
 sts_liang_empress.1.title: "凤冠压禁庭"
 sts_liang_empress.1.desc: "今日清晨，东京大内没有遵循太常寺的大婚旧仪，一切鼓吹仪仗，皆从中书政事堂径直开拔。\n\n宣德门洞开，数百名相府亲信重铠之士夹道拱卫。凤辇乘舆缓缓驶入福宁殿前，乘舆中所载的，正是丞相张嵩的及笄长女。她身披深青织金褕翟之服，首戴十二龙九凤翠盖花冠，面容冷峻，步入内廷。\n\n御座之上，少年官家两手紧紧抓着龙袍下摆，指节发白，面无血色。案几前展开的，是政事堂早早起草停当的《立后明诏》。内侍省与太常寺的近侍大臣早已全数被相府派员替换，无一人敢抬头直视帝目。在一片近乎死寂的朝拜声中，官家不得不颤抖着拿起朱毫，在册文上画下了御准。\n\n礼毕，玉玺与皇后金册交割。新皇后端坐中宫，六宫禁卫与司设诸局尽易张氏心腹，宫中内侍连私下一句耳语、递出一纸片布，皆需先经中宫过目核验。\n\n汴梁整座皇城，自外朝三省六部至内廷寝殿，至此如铁桶一般，尽数笼罩在相府的大幕之下。"
 sts_liang_empress.1.a: "山河在握，深宫亦定；这大宋天下，已如敝邑之庭院。"
 sts_liang_empress.2.title: "汴京急报：相女入主中宫"
 sts_liang_empress.2.desc: "汴梁传出加急驿报：权相张嵩强迫官家纳其长女为中宫皇后，册封九凤玉册，以兵甲监临禁中。京师士庶窃窃私语，谓‘今日汉献，魏氏椒房之祸复现于宋’。相府对朝堂与皇室的控制已臻极盛，大宋江山易姓，恐只在反掌之间……"
 sts_liang_empress.2.a: "欺天罔上，其心昭昭！"
