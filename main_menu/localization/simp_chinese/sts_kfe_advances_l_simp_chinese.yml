 a_traditions_dianqian_desc: "宿卫东京大内与开封府治的核心常备亲军。经相府整肃汰除后，尽选淮海魁梧健儿充实营伍。士卒身披全副冷锻铁甲，手持神臂强弩与斩马大刀，阵列森严、进退如堵，乃朝廷震慑天下诸藩的立国根本。"
