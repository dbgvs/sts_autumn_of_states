l_simp_chinese:
 sts_kfe_mandate_advance: "执掌天宪"
 sts_kfe_mandate_advance_desc: "我等入主大梁中枢，虽招致四方外藩的嫉恨与非议，天下无不觊觎我等代天牧民、总揽朝纲之权柄。即便如此，中枢之所以能屹立不倒，全赖相府冠绝海内的外交纵横与法理名分，远超四海任何藩镇。"
 sts_kfe_huairou_advance: "怀柔四方"
 sts_kfe_huairou_advance_desc: "汴梁四面受敌，单凭兵戈难以安抚海内。与其与四邻诸藩结下死仇，不若以相府的温言辞令和朝廷名分广布恩信。相府使臣往来于各镇关隘之间，极尽灵活应变之能事，纵有深怨宿仇，亦能在谈笑间化为通好盟约。"
 sts_kfe_dudu_advance: "都督军政"
 sts_kfe_dudu_advance_desc: "大兵交锋，胜在后方之转输充沛。相府总揽两海内兵政，打破旧日文武壅塞，以雷厉风行的官僚案牍严控兵员补给。无论大军征战于何处穷山恶水，后方新卒与辎重皆能络绎于道、迅速齐备。"
 sts_kfe_dianqian_1_advance: "殿前禁卫"
 sts_kfe_dianqian_1_advance_desc: "宿卫东京大内与开封府治的核心常备亲军。经相府整肃汰除后，尽选淮海魁梧健儿充实营伍。士卒身披全副冷锻铁甲，手持神臂强弩与斩马大刀，阵列森严、进退如堵，乃朝廷震慑天下诸藩的立国根本。"
 sts_kfe_dianqian_2_advance: "重组殿前禁卫"
 sts_kfe_dianqian_2_advance_desc: "经历大割据血火的残酷淬炼，中枢禁卫完成彻底重组。军士专享相府府库的充足粮饷与精良武备，摒弃华而不实的旧制花架，以重甲坚盾结阵于前、火器飞矢掩护于后，专克四方骑步强藩之正面冲击。"
 sts_kfe_dianqian_3_advance: "精锐殿前禁卫"
 sts_kfe_dianqian_3_advance_desc: "随着火器锻造技术的成熟，殿前司精锐率先整营换装精铁自生火铳。禁卫士卒兼通轮番齐射与白刃突刺之法，阵前枪焰蔽日、硝烟连绵，以绝对的火力压制与战术纪律撕裂封建军阀的旧式军阵。"
 sts_kfe_dianqian_4_advance: "近代殿前禁卫"
 sts_kfe_dianqian_4_advance_desc: "彻底按照近代正规军编组的中央王牌步军。全员列装标准化燧发枪与套筒刺刀，以步调一致的齐步进退与三段线列齐射闻名。这支高度职业化的中枢常备军，是粉碎一切割据叛乱的坚固铁壁。"
 sts_kfe_dianqian_5_advance: "帝国殿前禁卫"
 sts_kfe_dianqian_5_advance_desc: "专制极盛时代的皇权与相府铁拳。士卒历经最严苛的体能与效忠训练，装备帝国最顶尖的轻型野战火炮与精工火枪。无论中枢是权相代立亦或天子专权，他们皆是碾碎一切不臣的帝国王牌。"
 sts_kfe_dianqian_6_advance: "殿前帝国近卫"
 sts_kfe_dianqian_6_advance_desc: "历经数百年风云淬炼、走向近代战术巅峰的帝国最高近卫军团。享有至高无上的皇冠荣耀与全帝国最奢华的军备。凡金龙旗帜所向，后膛排枪如雷霆扫穴，任何妄图分裂神州者皆在其枪刺之下灰飞烟灭。"
