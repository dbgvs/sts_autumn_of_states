l_simp_chinese:
 sts_min_tihang_advance: "梯航万国"
 sts_min_tihang_advance_desc: "自朝廷移南外宗正司于泉州、由王氏世镇市舶以来，闽国便以掌控浩渺重洋为霸业根基。\n\n刺桐巨港千帆蔽日，大食、波斯与南洋诸番商贾接踵而至，将闽中白瓷、武夷名茶与绫罗丝缎倾销向万里海疆；而市舶司设立的严密抽解关税，更为府库带来了取之不尽的泼天巨资。在广袤外洋，无数装备精良的福船水师往来巡弋，守护着每一条海丝航道。大海本身，即是我闽国封疆之延伸！"
 sts_min_tongqu_advance: "闽道通衢"
 sts_min_tongqu_advance_desc: "世人皆谓“闽道崎岖、关塞重叠，陆师出山不易”。然而八闽人民生息于崇山深谷之间，早习得踏巉岩如平地之本领。\n\n闽王府沿闽江与九龙江大修悬崖栈道、穿山开道，更在武夷绝壁与仙霞天险设立快捷步驿。翻山越岭不再是阻隔政令与行商的天堑，无论是沿海刺桐的繁华市井，还是内陆深山处的建宁茶庄与汀州金石，皆在密布的山道水驿中联为一体，山河险要尽化为我御敌自如之腹地。"
