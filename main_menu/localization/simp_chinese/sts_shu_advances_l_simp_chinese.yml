l_simp_chinese:
 sts_shu_shudao_advance: "蜀道拓险"
 sts_shu_shudao_advance_desc: "从秦岭剑门山谷向天府沃野的进军，是历代川中经略的奠基之作。从昔年克拔汉中诸要冲，到平定四塞环围之险邑，我方轻装山野步军皆能履险如夷。士卒久经悬崖栈道的跋涉磨炼，更精于克拔高墙深沟之险塞，总能将攻陷的每一座雄关化作下一次进军的坚固据点。我们的军队是为攀山破隘、攻城拔寨而生，而非为平原放马而生。"
 sts_shu_jiaozi_advance: "益州交子务"
 sts_shu_jiaozi_advance_desc: "蜀道险峻难行，昔日行用铁钱重滞难运，百贾苦不堪言，成都巨商遂创“交子”，开天下纸币信用之先河。如今官府设局统管，严守府库实存金银作为“钞本”的法度，绝不超发滥造。\n\n币信坚挺使蜀中交子成为四方公认之通宝。商旅怀揣轻便纸券即可走遍全川，既免去了崇山峻岭间搬运沉重金属钱币的巨大损耗，使官府田赋商税得以如期满额入库；也促成了锦城钱庄兑坊的繁茂兴盛，使公私筹款借贷利息大为降低。"
 sts_shu_yuanrong_advance: "元戎遗制"
 sts_shu_yuanrong_advance_desc: "承袭昔年诸葛武侯“元戎十矢”机巧遗制的蜀中山地精锐。巴蜀工匠利用峡谷特产的坚韧梓木与水磨熟铁精工制弩，机牙咬合紧密，穿甲力极强。士卒轻装简从、极善攀岩涉险，临敌据险布列，机括引动之处矢石如雨倾泻，乃关陇铁骑与中原重步阵在山隘栈道中最忌惮的索命梦魇。"
 a_shu_yuanrong: "元戎劲弩手"
 a_shu_yuanrong_desc: "承袭昔年诸葛武侯“元戎十矢”机巧遗制的蜀中山地精锐。巴蜀工匠利用峡谷特产的坚韧梓木与水磨熟铁精工制弩，机牙咬合紧密，穿甲力极强。士卒轻装简从、极善攀岩涉险，临敌据险布列，机括引动之处矢石如雨倾泻，乃关陇铁骑与中原重步阵在山隘栈道中最忌惮的索命梦魇。"
