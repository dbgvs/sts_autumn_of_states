l_simp_chinese:
 sts_xia_yuejiajun_1_advance: "岳家军"
 sts_xia_yuejiajun_1_advance_desc: "岳氏代代相传的连营治军之法。昔年岳武穆以“冻死不拆屋、饿死不掳掠”铸就铁律，秦军遵此法扎营布列、严明赏罚。不仅尽去冗兵虚耗，更将步旅熔铸为一体，进退森严如壁，敌骑奔冲亦不能撼动分毫。"
 sts_xia_yuejiajun_2_advance: "岳家军重步兵"
 sts_xia_yuejiajun_2_advance_desc: "$sts_xia_yuejiajun_1_advance_desc$"
 sts_xia_yuejiajun_3_advance: "岳家军火铳手"
 sts_xia_yuejiajun_3_advance_desc: "$sts_xia_yuejiajun_1_advance_desc$"
