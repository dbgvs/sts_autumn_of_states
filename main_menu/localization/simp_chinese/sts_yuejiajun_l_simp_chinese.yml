 sts_yuejiajun: "岳家军"
 a_traditions_yuejiajun: "岳家军"
 a_traditions_yuejiajun_desc: "承袭武穆旧风的关中精锐重步兵。士卒身披全副冷锻步人甲，前排力士持麻扎刀与长柄大斧专破具装铁骑，后排配神臂弓交替轮射。战法严整悍勇，号称“撼山易，撼岳家军难”。"
 a_renaissance_yuejiajun: "岳家军重步兵"
 a_renaissance_yuejiajun_desc: "$a_traditions_yuejiajun_desc$"
 a_discovery_yuejiajun: "岳家军火铳手"
 a_discovery_yuejiajun_desc: "步入火器时代的关中岳氏精锐。士卒严守武穆铁律，改执精铁火铳与腰刀短斧。临敌依“三段迭阵”之法轮番引火齐射，铅弹与烈焰交织蔽日；遇敌近身肉搏亦不溃散。阵前炮火轰鸣，撼山军魂如旧。"
 a_reformation_yuejiajun: "岳家军火枪手"
 a_reformation_yuejiajun_desc: "$a_discovery_yuejiajun_desc$"
 a_absolutism_yuejiajun: "岳家军线列步兵"
 a_absolutism_yuejiajun_desc: "$a_discovery_yuejiajun_desc$"
 a_revolutions_yuejiajun: "岳家军纵队"
 a_revolutions_yuejiajun_desc: "$a_discovery_yuejiajun_desc$"
