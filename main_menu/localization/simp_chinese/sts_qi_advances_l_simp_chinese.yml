l_simp_chinese:
 sts_qi_haidai_advance: "海岱藩屏"
 sts_qi_haidai_advance_desc: "在建炎中兴之初，海岱旧齐之地屡遭战火蹂躏与大河水患摧残，千里丘墟、城邑残破。直到朝廷徙封忠烈韩氏坐镇青州、设立东方经略大藩，方给这片残破的边荒平原带来了法度与秩序。\n\n百年以来，历代齐王大兴土木，疏浚大河济水、修筑长堤要津、拔起座座雄城坞堡。代代营建之下，昔日的战乱边疆已然彻底蜕变，化为坐拥齐地膏腴、为天下诸邦瞩目的东陲擎天砥柱。"
 sts_qi_yiyong_advance: "忠烈遗勇"
 sts_qi_yiyong_advance_desc: "两军交锋，胜在气势如虹；三齐将士，向来以敢打敢冲傲视海内。自韩家世代统军以来，军中便立下铁规：临敌见红者赏，退后半步者斩。\n\n将帅率先挥刃冲锋，士卒无不舍命争先。当冲锋的号角裂空吹响，万千齐甲步骑如出闸猛虎般倾泻而下，蹄声如雷、刀光蔽日。这股百年来未曾熄灭的忠烈血勇，足以让齐军在最残酷的血战中死战不退，迸发出吞噬一切的无敌战意。"
 sts_qi_suxun_advance: "忠烈宿勋"
 sts_qi_suxun_advance_desc: "自昔年先祖转战江淮、分封青齐以来，随军征战的百战宿将皆在此裂土封庄、世袭军职。\n\n这些将门贵胄历来是我军最具战斗力的中流砥柱。他们自备良马重铠，视沙场建功为宗族至高无上的荣耀，一旦王府征召令下，成群结队的将门重甲健儿将毫不犹豫奔赴疆场，为齐王碾碎强敌。"
