 sts_consolidation.3.title: "巨擘横空：百府霸主并吞海内"
 sts_consolidation.3.desc: "探马的加急军情踏碎了各镇节堂的宁静。\n\n三年前，汴梁政事堂颁下《画境敕》，放任各镇自勘疆土，原本不过是群雄互夺渡口、蚕食四邻的乱局。然而谁也未曾料到，在这场百八十九镇的血腥绞杀中，竟有一方巨擘以雷霆之势狂飙突进——斩将搴旗、破关拔寨，如今其麾下直接统辖的险关要塞与富庶州县，已悍然突破百府之巨！\n\n百城之土，带甲数十万，赋税钱粮堆积如山。此前各州彼此牵制的微弱均势被彻底粉碎。海内余存的小藩在赫赫威势面前瑟瑟发抖，连东京城里的中枢相府，也不得不对其侧目正视。\n\n昔日各自为战、占山为王的割据序曲已然落幕。大争之世行至中局，天下再无苟安之所：要么卑辞厚礼向霸主屈膝称臣，要么合纵天下仅存的雄藩与其决一死战。"
 sts_consolidation.3.a: "大浪淘沙，真命之主已现锋芒！"
 sts_consolidation.4.title: "大蠹已成：雄藩逼临禁阙"
 sts_consolidation.4.desc: "汴梁政事堂西阁的巨大神州舆图上，一片刺目的重色已经连绵数百里，将东京畿甸紧紧包夹。\n\n张嵩凝视着案头的百城快报，脸色阴鸷如铁。当初中书省颁发《定疆令》，本欲行“驱虎吞狼、坐收渔利”之策，借各镇私斗消耗地方军阀实力。可如今，狼群之中竟真厮杀出了一头披甲带鳞的洪荒巨兽——一人坐拥百城，带甲之众已数倍于朝廷禁军！\n\n消息传至禁中，深宫里的少年官家惊惶失措，宫人内侍乱作一团；而朝中一众官僚的目光，已悄然从政事堂移向了这位新崛起的关外霸王。天下人皆心知肚明，这尊新霸主绝不会满足于偏安一方，其眼中所窥视的，唯有宣德楼上的天子龙椅与相府手中的尚方玉玺。\n\n“百城之势，已非敕书所能制也。”张嵩冷笑一声，拂袖卷起案头黄册，“传令枢密院与神机营：武库开锁，铁甲登城。汴梁不仅是天子的大内，更是相府的死生之地，且看此人敢否提兵问鼎！”"
 sts_consolidation.4.a: "巨患既起，朝廷唯有枕戈待旦，决一雌雄！"
 sts_consolidation.5.title: "神州陆沉：诸夏衣冠尽入黄沙"
 sts_consolidation.5.desc: "最后一个挂着赵宋官衔与诸侯仪仗的军镇堡垒，今日在烈火与战马践踏中轰然坍塌。\n\n自建炎绍兴中兴以来二百载，赵氏官家偏安一隅，百八十九路藩镇内斗攻伐百年不休。关陇的兵车、河东的铁骑、荆襄的戈矛与江淮的水师，未曾有一日停止过同室操戈的厮杀。当人们争夺城池、私立旗号、甚至为了一座渡口流血漂橹之时，却从未抬头看过塞外正悄然逼近的漫天铁蹄。\n\n如今，刀兵之声终归死寂。城池焚为瓦砾，宗庙化为灰烬。从太行之巅到江南水乡，所有名噪一时的藩侯节度，皆未能在这场倾天大祸中保全自己的名号。汴京的宫阙倾覆了，临安的画舫沉没了，甚至连那卷记载着百八十九镇名册的黄绢图经，也已被马蹄践作泥尘。\n\n诸夏衣冠，神州陆沉。中原大地的大宋割据纪元，竟以如此惨烈凄绝的万劫不复，画上了最终的句点。"
 sts_consolidation.5.a: "国破家亡，山河呜咽，青史再无完卷矣……"
 sts_consolidation_annihilated_condition_tt: "原始藩镇藩王中，仍存活且未被外部势力附庸者已不足两成（少于 41 家）"
 sts_consolidation.6.title: "社稷成墟：宣德楼下相府之殇"
 sts_consolidation.6.desc: "宣德门上的残阳如血，城外的异族战角已撕裂了东京汴梁最后一道护城重门。\n\n政事堂内寂寥无声，历任权相苦心经营的案牍档册被狂风吹得漫天飞卷。深宫里的天子早已不知所踪，御案上那方代代相传的传国玉玺已蒙上厚厚的烟尘。四方诸侯求援的急递不再响起——因为关东、关西、两浙与湖广的所有藩镇，皆已在异族铁骑的狂潮下相继湮灭。\n\n张嵩独自立于大庆殿的台阶上。他曾以此身为弈棋之人，将天下百八十九镇视作掌中棋子，任由他们相残自耗；他曾挟天子令海内，以为相府权柄可保万世安宁。然而，诸藩内耗掏空了神州的骨血，相府的机巧算计，在碾碎一切的山呼海啸面前，脆弱得如同一张薄纸。\n\n宫门之外，火光冲天，异族的马靴已踏碎了宣德楼的金水桥石阶。\n\n“万邦争鼎……到头来，竟是这般收场。”相府的长袍在烈风中猎猎作响，千年的帝阙神州，就此沦为异域穹庐的牧场。"
 sts_consolidation.6.a: "天命已尽，千古功罪，尽付这一把焦土！"
 sts_consolidation.7.title: "三载画境毕：战国鼎立，大争无休"
 sts_consolidation.7.desc: "距离当年东京颁布《三载画境敕》，整整三度春秋已过。\n\n三年的血火洗礼，让神州舆图换了一副彻底不同的容颜。曾经如同繁星碎石般密布各地的百八十九路微末小藩，大半已在这场残酷的兼并风暴中被邻敌生吞活剥；那些自立的小军寨、自封的草头王，早已化作荒草白骨。\n\n然而，天下并未迎来一统的曙光。三载期满，虽然四方兼并之战暂告段落，但海内并未出现能够独吞百城、威压群伦的单一霸主。相反，数个横跨州郡的庞大雄邦已然巍然耸立——关中铁骑、太行重关、荆襄舟师、海岱重镇，彼此犬牙交错、势均力敌！\n\n三年画境之令已成废纸，但天下已正式由“群雄碎斗”演变为“大国战国”。小打小闹的州县私斗结束了，摆在面前的，是真正关乎国运兴亡、动辄举国动员的列国大争！"
 sts_consolidation.7.a: "小邦已灭，战国方成！且与诸雄逐鹿中原！"
 sts_consolidation.8.title: "三年黄册定：相府案头的新战国"
 sts_consolidation.8.desc: "政事堂内，堆积如山的并非各镇请罪的降表，而是数份辞气倨傲、不可一世的《新定疆域图经》。\n\n三年之前，张嵩亲笔签发敕书，令海内“三年画境”。如今三年期满，那些繁杂琐碎的弱小县镇确实被清洗一空，但呈送至相府案头的，却是一张令人心惊的新棋局：海内虽然无单一势力达成百城之霸，但数家跨州连郡的庞大雄藩已然成型！\n\n各镇如今地盘稳固、兵强马壮，递上来的黄册非但没有向中枢纳贡之意，反而处处向相府索要更尊崇的王爵异姓封号与开府便宜之权。\n\n驱虎吞狼之策，终究养出了数只真正的猛虎。朝廷想要像过去那样凭一纸加盖御宝的黄牒号令天下，已是痴人说梦。\n\n“三年已满，群狼已成猛虎。”张嵩拿起朱笔，在数大雄藩的名字上重重圈下红印，“传檄诸部：自今日起，中书省不再调解边嫌。结一家、伐一家、分一家——相府要与这神州诸王，在棋盘上好好下一局生死大棋了！”"
 sts_consolidation.8.a: "列雄并峙，天下如棋；相府执黑，谁敢言胜！"
